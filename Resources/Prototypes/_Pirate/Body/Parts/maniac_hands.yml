# Maniac Hands — paired cybernetic hand replacements.
# Install via standard hand-attachment surgery (SurgeryAttachLeftHand/RightHand).
# When BOTH hands are installed on the same body, the Maniac Hands mechanic activates:
# empty-handed strikes deal escalating damage per kill, with sanity drain.

- type: entity
  parent: LeftHandCybernetic
  id: ManiacLeftHand
  name: maniac left hand
  description: A cybernetic left hand with built-in murder-lust. Install on both hands to awaken the maniac within.
  components:
  - type: Sprite
    sprite: _Pirate/Implants/ManiacHands/maniac_hands.rsi
    state: maniac_hands_left
  - type: ManiacHand
    side: Left
  - type: CyberpsychosisLoad
    sanityCost: 7.5

- type: entity
  parent: RightHandCybernetic
  id: ManiacRightHand
  name: maniac right hand
  description: A cybernetic right hand with built-in murder-lust. Install on both hands to awaken the maniac within.
  components:
  - type: Sprite
    sprite: _Pirate/Implants/ManiacHands/maniac_hands.rsi
    state: maniac_hands_right
  - type: ManiacHand
    side: Right
  - type: CyberpsychosisLoad
    sanityCost: 7.5

- type: entity
  id: ManiacHandsPair
  name: maniac hands pair
  description: A case containing a matched pair of Maniac Hands cybernetic replacements. Install both hands to awaken the maniac within.
  components:
  - type: Storage
    maxItemSize: Normal
    defaultStorageOrientation: Vertical
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _Pirate/Implants/ManiacHands/maniac_hands.rsi
    state: maniac_hands
  - type: StorageFill
    contents:
    - id: ManiacLeftHand
    - id: ManiacRightHand