# A cybernetic arm augment (installed via the stock arm-augment surgery:
# SurgeryOpenArmAugment + SurgeryInsertArmAugment) that turns empty-handed
# strikes into devastating weapons. Buyable from the syndicate uplink.

- type: entity
  parent: BaseArmAugment
  id: ManiacHandsArm
  name: maniac hands
  description: A cybernetic arm augment that turns your empty fists into devastating weapons. Each kill makes them hit harder, but every strike gnaws at your sanity.
  components:
  - type: Sprite
    state: strength
  - type: ManiacHandsArm
  - type: CyberpsychosisLoad
    sanityCost: 15